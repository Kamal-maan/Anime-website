{%extends "index.html"%}

{%block title%}My Masterpiece{%endblock%}

{%block content%} 
    <div class="Ano"><h2>Lets Explore</h2></div>
    <hr>
    <div class="cont">
        {%for item in anime_list%}
        <a href="{{item.Link}}" class="xbox" style="background-image: linear-gradient(to bottom, transparent 40%, black 100%), url('{{item.Cover}}');"><p>{{item.Title}}</p><p> {{item.genres}} </p></a>
        {%endfor%}
    </div>
{%endblock%}
