{%extends "index.html"%}

{%block title%}My Anime{%endblock%}

{%block content%} 
    <div class="Ano"><h2>Lets Explore</h2></div>
    <hr>
    <div class="cont">
        {%for anime in anime_list%}
        <a href="{{anime.siteUrl}}" class="xbox" style="background-image: linear-gradient(to bottom, transparent 40%, black 100%), url('{{anime.coverImage.large}}');"><p>{{anime.title.english}}</p><p> {{anime.episodes}} </p></a>
        {%endfor%}
    </div>
{%endblock%}
